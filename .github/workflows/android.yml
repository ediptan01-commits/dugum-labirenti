name: Blok Birleştirme Android APK ve Play AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: On bölümü doğrula
        run: node scripts/validate-levels.cjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android projesini oluştur
        run: |
          flutter create --platforms android --project-name dugum_labirenti --org com.teknolojix .
          rm -f test/widget_test.dart
          sed -i 's/android:label="dugum_labirenti"/android:label="Blok Birleştirme"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="Düğüm Labirenti"/android:label="Blok Birleştirme"/' android/app/src/main/AndroidManifest.xml

      - name: Oyun ikonunu Android uygulamasına uygula
        run: |
          python3 -m pip install --quiet cairosvg Pillow
          python3 scripts/install_launcher_icon.py
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Paketleri indir ve test et
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Test APK oluştur
        run: flutter build apk --debug

      - name: Test APK'yi yükle (Play Store için değil)
        uses: actions/upload-artifact@v4
        with:
          name: Blok-Birlestirme-TEST-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Play imza sırları mevcut mu kontrol et
        id: signing
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
        run: |
          if [ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$PLAY_STORE_PASSWORD" ] && [ -n "$PLAY_KEY_PASSWORD" ] && [ -n "$PLAY_KEY_ALIAS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Özel Play upload imzası yapılandırılacak."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Play AAB oluşturulmadı. GitHub Actions secrets: PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_STORE_PASSWORD, PLAY_KEY_PASSWORD, PLAY_KEY_ALIAS."
            exit 1
          fi

      - name: Özel imzalama anahtarını güvenli şekilde yükle
        if: steps.signing.outputs.ready == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          python3 scripts/configure_play_signing.py

      - name: Play imzalama anahtarını önceden doğrula
        if: steps.signing.outputs.ready == 'true'
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/upload-keystore.jks -storepass:env PLAY_STORE_PASSWORD -alias "$PLAY_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Play imzalama anahtari acilamadi. GitHub Secrets PLAY_STORE_PASSWORD veya PLAY_KEY_ALIAS degerlerini imzalama yedegindeki bilgilerle yeniden eslestirin."
            exit 1
          fi
          if ! keytool -certreq -keystore android/upload-keystore.jks -storepass:env PLAY_STORE_PASSWORD -keypass:env PLAY_KEY_PASSWORD -alias "$PLAY_KEY_ALIAS" -file "$RUNNER_TEMP/upload.csr" >/dev/null 2>&1; then
            echo "::error::Private key password validation failed. Check PLAY_KEY_PASSWORD."
            exit 1
          fi
          mkdir -p build
          keytool -exportcert -keystore android/upload-keystore.jks -storepass:env PLAY_STORE_PASSWORD -alias "$PLAY_KEY_ALIAS" -file build/upload-certificate.der >/dev/null 2>&1
          echo "Upload keystore, alias and private key password verified."

      - name: Play için imzalı APK ve AAB oluştur
        if: steps.signing.outputs.ready == 'true'
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab >/dev/null
          java scripts/VerifyBundle.java build/app/outputs/bundle/release/app-release.aab build/upload-certificate.der
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk > build/apk-signature.txt
          python3 scripts/verify_release.py
          cd build/app/outputs/flutter-apk
          sha256sum app-release.apk
          echo "Signed APK and AAB verification succeeded."

      - name: İmzalı APK'yi yükle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Blok-Birlestirme-SIGNED-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Play Store için imzalı AAB'yi yükle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Blok-Birlestirme-PLAY-SIGNED-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Doğrulama raporu ve mağaza ikonunu yükle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Blok-Birlestirme-RELEASE-VERIFICATION
          path: |
            build/release-verification.json
            build/apk-signature.txt
            build/upload-certificate.der
            assets/store_icon_512.png
          if-no-files-found: error

      - name: Geçici imzalama dosyasını temizle
        if: always()
        run: rm -f android/upload-keystore.jks "$RUNNER_TEMP/upload.csr"
