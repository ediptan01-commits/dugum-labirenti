name: Düğüm Labirenti Android APK ve Play AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: On bölümü doğrula
        run: node scripts/validate-levels.cjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android projesini oluştur
        run: |
          flutter create --platforms android --project-name dugum_labirenti --org com.teknolojix .
          rm -f test/widget_test.dart
          sed -i 's/android:label="dugum_labirenti"/android:label="Düğüm Labirenti"/' android/app/src/main/AndroidManifest.xml

      - name: Paketleri indir ve test et
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Test APK oluştur
        run: flutter build apk --debug

      - name: Test APK'yi yükle (Play Store için değil)
        uses: actions/upload-artifact@v4
        with:
          name: Dugum-Labirenti-TEST-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Play imza sırları mevcut mu kontrol et
        id: signing
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
        run: |
          if [ -n "$PLAY_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$PLAY_STORE_PASSWORD" ] && [ -n "$PLAY_KEY_PASSWORD" ] && [ -n "$PLAY_KEY_ALIAS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Özel Play upload imzası yapılandırılacak."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play AAB oluşturulmadı. GitHub Actions secrets: PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_STORE_PASSWORD, PLAY_KEY_PASSWORD, PLAY_KEY_ALIAS."
          fi

      - name: Özel imzalama anahtarını güvenli şekilde yükle
        if: steps.signing.outputs.ready == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          python3 scripts/configure_play_signing.py

      - name: Play için imzalı APK ve AAB oluştur
        if: steps.signing.outputs.ready == 'true'
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
        run: |
          flutter build apk --release
          flutter build appbundle --release
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab >/dev/null
          echo "Signed AAB verification succeeded."

      - name: İmzalı APK'yi yükle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dugum-Labirenti-SIGNED-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Play Store için imzalı AAB'yi yükle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Dugum-Labirenti-PLAY-SIGNED-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
