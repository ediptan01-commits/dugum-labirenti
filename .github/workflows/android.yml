name: Düğüm Labirenti Android APK ve AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları al
        uses: actions/checkout@v4

      - name: 10 bölüm çözüm doğrulaması
        run: node scripts/validate-levels.cjs

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: |
          flutter create --platforms android --project-name dugum_labirenti --org com.teknolojix .
          rm -f test/widget_test.dart
          sed -i 's/android:label="dugum_labirenti"/android:label="Düğüm Labirenti"/' android/app/src/main/AndroidManifest.xml

      - name: Paketleri indir
        run: flutter pub get

      - name: Dart analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Release APK
        run: flutter build apk --release

      - name: Release AAB
        run: flutter build appbundle --release

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Dugum-Labirenti-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: AAB dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Dugum-Labirenti-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
